name: CI Workflow

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./lab-module06-testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lab-module06-testing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test -- --run

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: ./lab-module06-testing
          install: false
          package-manager-cache: false
          start: pnpm run start:ci --host localhost --port 5173 --strictPort
          wait-on: http://localhost:5173
          wait-on-timeout: 120
          command: pnpm exec cypress run

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: lab-module06-testing/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: lab-module06-testing/cypress/videos
          if-no-files-found: ignore
